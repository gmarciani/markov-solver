name: PR Validation

on:
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Unit tests on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Graphviz
      run: sudo apt-get install -y graphviz

    - name: Install tox
      run: |
        python -m pip install --upgrade pip
        pip install tox

    - name: Run tests on Python ${{ matrix.python-version }}
      run: tox -e ${{ matrix.python-version }}

  quality:
    name: Lint, type check and coverage gate
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'

    - name: Install Graphviz
      run: sudo apt-get install -y graphviz

    - name: Install tox
      run: |
        python -m pip install --upgrade pip
        pip install tox

    - name: Run linting
      run: tox -e lint

    - name: Run type checking
      run: tox -e type

    - name: Check code coverage
      run: |
        pip install -e ".[dev]"
        coverage_result=$(pytest tests/ --cov=markov_solver --cov-report=term-missing | grep TOTAL | awk '{print $4}' | sed 's/%//')
        if [ "$coverage_result" -lt 90 ]; then
          echo "Coverage $coverage_result% is below 90% threshold"
          exit 1
        fi
        echo "Coverage $coverage_result% meets 90% threshold"
